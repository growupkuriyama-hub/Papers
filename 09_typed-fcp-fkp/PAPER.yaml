main_results:
  - "Theorem A (thm:duality, lem:reduction): kernel classes shrink and context classes grow under refinement of the typing; typed very weak FKP = typed weak FKP; strict at U1 for every k (prop:strict-context, prop:strict-kernel); untyped weak FCP not preserved by an observer (prop:weak-not-preserved, conditional on KY2017 Lemmas 8, 12)"
  - "Theorem B, main new result (thm:deletion, lem:capture, cor:primal-data, prop:dual-refutation): M_n = L_n minus one word forces rho*|N|*max(kappa,1) >= 3*2^(n-1)-1 for every VW-FKP grammar under every typing, while U1 gives an O(n) typed strong 1-FCP presentation; dual learners need a datum of length >= 3*2^(n-1)-2"
  - "Corollary (thm:uniform), known: one untyped primal learner identifies the union of all fixed-typing substitutable CFLs; follows from #1 Prop 9.7"
known_parts:
  - "prop:learners is an instance of Yoshinaka (2015) sorted framework"
  - "typed context sets lie in the extended regular closure of Kanazawa-Yoshinaka (2023) (rem:exreg)"
  - "thm:uniform follows from #1 Prop 9.7 + Yoshinaka 2015 Sec. 6.3 + KY2017 Thm 6"
  - "lem:star, lem:reduction are direct consequences of KY2017 Eq. (1) and Sec. 4"
