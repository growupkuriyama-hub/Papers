main_results:
  - "Theorem A, main result (prop:untyped-frames, prop:deletion-upper, thm:deletion; lem:capture; the restating Theorem 4.8 thm:gap was removed on 2026-11-27): kernel-context gap. The same grammar H_n (2n nonterminals) has the typed strong 1-FCP with frames of length <= 2n and the typed strong 1-FKP (untyped very weak 1-FKP) with exemplars of length max(3*2^(n-1)-2, 2n+1); every VW-FKP presentation has rho*|N|*max(kappa,1) >= 3*2^(n-1)-1, so the exemplar side is tight up to O(n). M_n (at least one mark, a global licensing condition) has an O(n) typed strong 1-FCP presentation under the two-element mark observer, while every VW-FKP presentation under every typing has rho*|N|*max(kappa,1) >= 3*2^(n-1)-1; L_n has O(n) presentations on both sides"
  - "Applications (Section 5): positive-data Rec_s needs ||K||^3 >= 3*2^(n-1)-1 on M_n (cor:rec-data, not in #1); primal learner with MQ 2^Omega(n) data (cor:primal-data); dual learners a datum of length >= 3*2^(n-1)-2 (prop:dual-refutation)"
  - "Theorem B (thm:duality, lem:reduction): refining the observer enlarges context classes and shrinks kernel classes; typed VW-FKP = typed W-FKP; strict at U1 for every k (prop:strict-context, prop:strict-kernel); untyped weak FCP not preserved (prop:weak-not-preserved, conditional on KY2017 Lemmas 8, 12)"
  - "Corollary (thm:uniform), known: one untyped primal learner identifies the union of all fixed-typing substitutable CFLs; follows from #1 Prop 9.7"
presentation:
  - "Introduction in mathematical-linguistics style: categories named by frames (FCP) or exemplars (FKP), worked toy fragment with number agreement (ex:toy, tools/check_toy_example.py)"
  - "[removed 2026-11-27] Python generator functions motivate the licensing condition of Theorem A in the introduction (2026-11-26); the discussion keeps only the caveats for a literal transfer; Mandarin analogue removed; no empirical claim or transferred lower bound for real languages"
