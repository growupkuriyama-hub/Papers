  - "typed context sets lie in the extended regular closure of Kanazawa-Yoshinaka (2023) (rem:exreg)"
  - "thm:uniform follows from #1 Prop 9.7 + Yoshinaka 2015 Sec. 6.3 + KY2017 Thm 6"
  - "lem:star, lem:reduction are direct consequences of KY2017 Eq. (1) and Sec. 4"
