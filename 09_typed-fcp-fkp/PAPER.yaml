main_results:
  - "Theorem A (thm:duality, lem:reduction): kernel classes shrink and context classes grow under refinement of the typing; typed very weak FKP = typed weak FKP; strict at U1 (prop:strict-context, prop:strict-kernel)"
  - "Theorem B (thm:uniform): every fixed-s substitutable CFL, for every s, has the untyped weak 1-FKP with rank 2; one primal learner identifies the union over all s with membership queries"
  - "Theorem C (thm:deletion, lem:capture, cor:primal-data, prop:dual-refutation): M_n = L_n minus one word forces size or kernel length 2^Omega(n) for every VW-FKP grammar under every typing, while U1 gives an O(n) typed strong 1-FCP presentation; dual learners need a datum of length >= 3*2^(n-1)-2"
known_parts:
  - "prop:learners is an instance of Yoshinaka (2015) sorted framework"
  - "typed context sets lie in the extended regular closure of Kanazawa-Yoshinaka (2023) (rem:exreg)"
