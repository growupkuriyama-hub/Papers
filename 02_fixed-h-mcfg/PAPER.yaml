  review:
    note: "v81 is the pre-submission editorial and mathematical source-audit revision: concise EN/JP abstracts, synchronized conclusions, reproducibility/data declaration, and review checklist. The v80 mathematical results are unchanged. Final author signoff and full-page PDF inspection remain open. v80 adds type deletion, rare-type positive lower bounds, power-transfer and Ramsey shift, a universal finite-typing nonmembership obstruction, distributional witness bounds and abelian-filtered polynomial data. The original f>=2 superpolynomial lower-bound question remains open. v79 eliminates separate nonterminal positive witnesses by choosing canonical tuples via a consistent minimum-weight derivation DAG; the computable presentation budget becomes a rule-only sum, while worst-case exponents remain unchanged. v78 proves a fixed-window failure of arity-two substitutability for the original bracketed family. The fan-out-two evidence lower bound is still open. v77 adds a presentation-sensitive computable characteristic-data budget and cites Almeida et al. (2009), Proposition 2.3, for the known LG/semilattice characterization, distinguishing that prior algebra from the MCFG quantitative extension. English/Japanese sources synchronized. Full independent proof audit, human PDF visual review, and author signoff remain submission gates."
