  note: "Qualitative learning proofs and Gold/effectivity details were relocated to appendices while the Yoshinaka 2015 and typed witness interfaces remain in the main text. New unrestricted-standard-MCFG input result measures component-pattern thickness, yielding O(n^3*t) for windows/window-groups and O(n^4*t) for local groups, with fixed fan-out and rule rank. No general ordinary-rule-thickness bound is claimed for inputs with empty components. Integrated rare-fibre and finite-target work is retained; all results require author mathematical review before I&C submission."

