name: Publish TCS 1 marked manuscript and synchronized reviewer response

on:
  push:
    branches: [main]
    paths:
      - "01_fixed-h-cfg/main.tex"
      - "01_fixed-h-cfg/TCS-D-26-00494_Manuscript_Clean.tex"
      - "01_fixed-h-cfg/response/response_round1.tex"
      - "01_fixed-h-cfg/response/synchronize_marked_locators.py"
      - "01_fixed-h-cfg/response/check_submission_consistency.py"
      - ".github/workflows/publish-tcs1-revision-package.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tcs1-round1-package
  cancel-in-progress: true

jobs:
  publish-review-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Verify clean source mirror
        run: cmp 01_fixed-h-cfg/main.tex 01_fixed-h-cfg/TCS-D-26-00494_Manuscript_Clean.tex

      - name: Install latexdiff and poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y latexdiff poppler-utils

      - name: Generate marked-up revised manuscript
        working-directory: 01_fixed-h-cfg
        run: |
          latexdiff --type=UNDERLINE --disable-citation-markup --math-markup=0 \
            archive/tcs-round1-arxiv-v4/main.tex \
            main.tex > main_marked_round1.tex
          python3 - <<'PY'
          from pathlib import Path

          p = Path("main_marked_round1.tex")
          s = p.read_text()

          # Deleted material from the submitted manuscript is omitted from the
          # marked-up revised copy; additions remain visibly marked by
          # latexdiff. This keeps the revised manuscript's pagination and
          # numbering usable in the response letter.
          doc = r"\begin{document}"
          if doc not in s:
              raise SystemExit("begin-document marker not found")
          pre, body = s.split(doc, 1)

          def strip_deleted_blocks(text):
              # latexdiff can mix ordinary and FL deletion boundary variants
              # around large environment-level rewrites. For this
              # additions-only marked manuscript, pair the earliest deletion
              # start with the earliest deletion end of either variant.
              pos = 0
              begins = (r"\DIFdelbeginFL", r"\DIFdelbegin")
              ends = (r"\DIFdelendFL", r"\DIFdelend")
              while True:
                  starts = []
                  for begin in begins:
                      k = text.find(begin, pos)
                      while k >= 0 and begin == r"\DIFdelbegin" and text.startswith(r"\DIFdelbeginFL", k):
                          k = text.find(begin, k + 1)
                      if k >= 0:
                          starts.append((k, begin))
                  if not starts:
                      return text
                  k, begin = min(starts, key=lambda x: x[0])

                  finishes = []
                  for end_token in ends:
                      q = text.find(end_token, k + len(begin))
                      if q >= 0:
                          finishes.append((q, end_token))
                  if not finishes:
                      raise SystemExit(f"unmatched deletion block starting with {begin}")
                  q, end_token = min(finishes, key=lambda x: x[0])
                  text = text[:k] + text[q + len(end_token):]
                  pos = max(0, k - 20)

          def remove_macro_argument(text, macro):
              pos = 0
              while True:
                  k = text.find(macro, pos)
                  if k < 0:
                      return text
                  if macro == r"\DIFdel" and text.startswith(r"\DIFdelFL", k):
                      pos = k + 1
                      continue
                  j = k + len(macro)
                  while j < len(text) and text[j].isspace():
                      j += 1
                  if j >= len(text) or text[j] != "{":
                      pos = j
                      continue
                  depth = 0
                  q = j
                  while q < len(text):
                      ch = text[q]
                      if ch == "\\":
                          q += 2
                          continue
                      if ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              q += 1
                              break
                      q += 1
                  if depth != 0:
                      raise SystemExit(f"unbalanced argument of {macro}")
                  text = text[:k] + text[q:]
                  pos = max(0, k - 20)

          body = strip_deleted_blocks(body)
          for macro in (r"\DIFdelFL", r"\DIFdel"):
              body = remove_macro_argument(body, macro)
          for token in (
              r"\DIFdelbeginFL", r"\DIFdelendFL",
              r"\DIFdelbegin", r"\DIFdelend",
          ):
              body = body.replace(token, "")

          # Deleted round-1 material used packages/macros no longer present in
          # the revised paper. Keep a small compatibility preamble so the
          # latexdiff-generated source remains robust.
          marker = r"\theoremstyle{plain}"
          if marker not in pre:
              raise SystemExit("theoremstyle marker not found")
          pre = pre.replace(
              marker,
              marker + "\n" + r"\input{response/latexdiff_compat.tex}",
              1,
          )

          p.write_text(pre + doc + body)
          PY


      - name: Build additions-marked revised manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main_marked_round1.tex
          working_directory: 01_fixed-h-cfg
          texlive_version: 2026

      - name: Fix tracked marked filename, synchronize response with marked PDF
        shell: bash
        run: |
          set -euo pipefail
          cd 01_fixed-h-cfg
          cp main_marked_round1.pdf TCS-D-26-00494_Manuscript_Marked.pdf
          python3 response/synchronize_marked_locators.py

      - name: Check R1 prose and actual manuscript statement numbers
        run: python3 01_fixed-h-cfg/response/check_submission_consistency.py

      - name: Build response to reviewers from verified marked PDF locators
        uses: xu-cheng/latex-action@v4
        with:
          root_file: response_round1.tex
          working_directory: 01_fixed-h-cfg/response
          texlive_version: 2026

      - name: Validate all outputs
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            01_fixed-h-cfg/TCS-D-26-00494_Manuscript_Marked.pdf \
            01_fixed-h-cfg/response/response_round1.pdf; do
            test -s "$p"
            test "$(head -c 4 "$p")" = "%PDF"
            pdfinfo "$p" | grep -E '^(Pages|Page size):'
          done
          pdftotext -layout 01_fixed-h-cfg/response/response_round1.pdf - | grep -q 'R1.32'
          pdftotext -layout 01_fixed-h-cfg/response/response_round1.pdf - | grep -q 'R2.11'

      - name: Prepare exact three-file submission bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tcs-r1-mobile-bundle"
          cp 01_fixed-h-cfg/TCS-D-26-00494_Manuscript_Clean.tex "$RUNNER_TEMP/tcs-r1-mobile-bundle/TCS-D-26-00494_Manuscript_Clean.tex"
          cp 01_fixed-h-cfg/TCS-D-26-00494_Manuscript_Marked.pdf "$RUNNER_TEMP/tcs-r1-mobile-bundle/TCS-D-26-00494_Manuscript_Marked.pdf"
          cp 01_fixed-h-cfg/response/response_round1.pdf "$RUNNER_TEMP/tcs-r1-mobile-bundle/TCS-D-26-00494_Response_to_Reviewers.pdf"
          cmp "$RUNNER_TEMP/tcs-r1-mobile-bundle/TCS-D-26-00494_Manuscript_Clean.tex" 01_fixed-h-cfg/main.tex

      - name: Build downloadable three-file ZIP
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP/tcs-r1-mobile-bundle"
            zip -q "$RUNNER_TEMP/TCS-D-26-00494_R1_3files.zip" \
              TCS-D-26-00494_Manuscript_Clean.tex \
              TCS-D-26-00494_Manuscript_Marked.pdf \
              TCS-D-26-00494_Response_to_Reviewers.pdf
          )
          unzip -t "$RUNNER_TEMP/TCS-D-26-00494_R1_3files.zip"
          test "$(unzip -Z1 "$RUNNER_TEMP/TCS-D-26-00494_R1_3files.zip" | wc -l)" -eq 3

      - name: Upload exact three-file mobile bundle
        uses: actions/upload-artifact@v4
        with:
          name: TCS-D-26-00494-R1-exact-three-files
          path: ${{ runner.temp }}/tcs-r1-mobile-bundle/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish marked PDF and its synchronized reviewer response
        shell: bash
        run: |
          set -euo pipefail
          cp 01_fixed-h-cfg/TCS-D-26-00494_Manuscript_Marked.pdf "$RUNNER_TEMP/marked.pdf"
          cp 01_fixed-h-cfg/response/response_round1.pdf "$RUNNER_TEMP/response.pdf"
          cp 01_fixed-h-cfg/response/response_round1.tex "$RUNNER_TEMP/response.tex"
          test -s "$RUNNER_TEMP/TCS-D-26-00494_R1_3files.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- \
              01_fixed-h-cfg/main.tex \
              01_fixed-h-cfg/TCS-D-26-00494_Manuscript_Clean.tex \
              01_fixed-h-cfg/response/response_round1.tex \
              01_fixed-h-cfg/response/synchronize_marked_locators.py; then
              echo "::error::Source changed during marked-PDF build; refusing stale output."
              exit 1
            fi
            git reset --hard origin/main
            cp "$RUNNER_TEMP/marked.pdf" 01_fixed-h-cfg/TCS-D-26-00494_Manuscript_Marked.pdf
            cp "$RUNNER_TEMP/response.pdf" 01_fixed-h-cfg/TCS-D-26-00494_Response_to_Reviewers.pdf
            cp "$RUNNER_TEMP/response.tex" 01_fixed-h-cfg/response/response_round1.tex
            cp "$RUNNER_TEMP/TCS-D-26-00494_R1_3files.zip" 01_fixed-h-cfg/TCS-D-26-00494_R1_3files.zip
            git add \
              01_fixed-h-cfg/TCS-D-26-00494_Manuscript_Marked.pdf \
              01_fixed-h-cfg/TCS-D-26-00494_Response_to_Reviewers.pdf \
              01_fixed-h-cfg/TCS-D-26-00494_R1_3files.zip \
              01_fixed-h-cfg/response/response_round1.tex
            if git diff --cached --quiet; then
              echo "Published artifacts already current."
              exit 0
            fi
            git commit -m "Publish TCS #1 marked manuscript and PDF-anchored response [skip ci]"
            if git push origin HEAD:main; then
              echo "Published synchronized marked manuscript and reviewer response."
              exit 0
            fi
            echo "Concurrent publish; retry $attempt/5"
          done
          echo "::error::Could not publish current review package."
          exit 1
