name: Build LaTeX papers

on:
  push:
    branches: [main]
    paths:
      - "**/*.tex"
      - "**/*.cls"
      - "**/*.sty"
      - ".github/workflows/latex-build.yml"
  pull_request:
    paths:
      - "**/*.tex"
      - "**/*.cls"
      - "**/*.sty"
      - ".github/workflows/latex-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdflatex:
    name: "pdfLaTeX — ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: "01 fixed-h CFG"
            dir: "01_fixed-h-cfg"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "01-fixed-h-cfg-pdf"
            texlive: 2026
          - name: "01 Response to Reviewers"
            dir: "01_fixed-h-cfg/response"
            root: "response_round1.tex"
            pdf: "response_round1.pdf"
            artifact: "01-fixed-h-cfg-response-pdf"
            texlive: 2026
          - name: "02 fixed-h MCFG"
            dir: "02_fixed-h-mcfg"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "02-fixed-h-mcfg-pdf"
            texlive: 2026
          - name: "03 SCL-Compression"
            dir: "03_scl-compression"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "03-scl-compression-pdf"
            texlive: 2026
          - name: "04 Relative Factorization"
            dir: "04_relative-factorization"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "04-relative-factorization-pdf"
            texlive: 2026
          - name: "05 JALC Occurrence Descriptors"
            dir: "05_jalc-occurrence-descriptors"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "05-jalc-occurrence-descriptors-pdf"
            texlive: 2025
          - name: "06 OFET"
            dir: "06_ofet"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "06-ofet-pdf"
            texlive: 2026
          - name: "07 Minimum Observer Size"
            dir: "07_Minimal_Observation_Is_Not_Enough"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "07-minimum-observer-size-pdf"
            texlive: 2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile with pdfLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ matrix.root }}
          working_directory: ${{ matrix.dir }}
          texlive_version: ${{ matrix.texlive }}

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}/${{ matrix.pdf }}
          if-no-files-found: error
          retention-days: 30

  build-japanese:
    name: "LuaLaTeX — 01 fixed-h CFG Japanese"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile Japanese version with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main_JP.tex
          working_directory: 01_fixed-h-cfg/japanese
          texlive_version: 2026
          latexmk_use_lualatex: true

      - name: Upload Japanese PDF
        uses: actions/upload-artifact@v7
        with:
          name: 01-fixed-h-cfg-japanese-pdf
          path: 01_fixed-h-cfg/japanese/main_JP.pdf
          if-no-files-found: error
          retention-days: 30
