name: Build LaTeX papers

on:
  push:
    branches: [main]
    paths:
      - "**/*.tex"
      - "**/*.cls"
      - "**/*.sty"
      - ".github/workflows/latex-build.yml"
  pull_request:
    paths:
      - "**/*.tex"
      - "**/*.cls"
      - "**/*.sty"
      - ".github/workflows/latex-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdflatex:
    name: "pdfLaTeX — ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: "01 fixed-h CFG"
            dir: "01_fixed-h-cfg"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "01-fixed-h-cfg-pdf"
            texlive: 2026
          - name: "01 Response to Reviewers"
            dir: "01_fixed-h-cfg/response"
            root: "response_round1.tex"
            pdf: "response_round1.pdf"
            artifact: "01-fixed-h-cfg-response-pdf"
            texlive: 2026
          - name: "02 fixed-h MCFG"
            dir: "02_fixed-h-mcfg"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "02-fixed-h-mcfg-pdf"
            texlive: 2026
          - name: "03 SCL-Compression"
            dir: "03_scl-compression"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "03-scl-compression-pdf"
            texlive: 2026
          - name: "04 Relative Factorization"
            dir: "04_relative-factorization"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "04-relative-factorization-pdf"
            texlive: 2026
          - name: "05 JALC Occurrence Descriptors"
            dir: "05_jalc-occurrence-descriptors"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "05-jalc-occurrence-descriptors-pdf"
            texlive: 2025
          - name: "06 OFET"
            dir: "06_ofet"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "06-ofet-pdf"
            texlive: 2026
          - name: "07 Minimum Observer Size"
            dir: "07_Minimal_Observation_Is_Not_Enough"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "07-minimum-observer-size-pdf"
            texlive: 2026
          - name: "08 PAC_n fixed-h VC geometry"
            dir: "08_pacn-fixed-h-distributional-learning"
            root: "main.tex"
            pdf: "main.pdf"
            artifact: "08-pacn-fixed-h-vc-geometry-pdf"
            texlive: 2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile with pdfLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ matrix.root }}
          working_directory: ${{ matrix.dir }}
          texlive_version: ${{ matrix.texlive }}

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.dir }}/${{ matrix.pdf }}
            ${{ matrix.dir }}/${{ matrix.root }}
          if-no-files-found: error
          retention-days: 30

  build-japanese:
    name: "LuaLaTeX — 01 fixed-h CFG Japanese"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile Japanese version with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main_JP.tex
          working_directory: 01_fixed-h-cfg/japanese
          texlive_version: 2026
          latexmk_use_lualatex: true

      - name: Upload Japanese PDF
        uses: actions/upload-artifact@v7
        with:
          name: 01-fixed-h-cfg-japanese-pdf
          path: 01_fixed-h-cfg/japanese/main_JP.pdf
          if-no-files-found: error
          retention-days: 30


  build-marked-up:
    name: "pdfLaTeX — 01 fixed-h CFG marked-up revision"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install latexdiff
        run: |
          sudo apt-get update
          sudo apt-get install -y latexdiff

      - name: Generate marked-up revised manuscript
        working-directory: 01_fixed-h-cfg
        run: |
          latexdiff --type=UNDERLINE --disable-citation-markup --math-markup=0 \
            archive/tcs-round1-arxiv-v4/main.tex \
            main.tex > main_marked_round1.tex
          python3 - <<'PY'
          from pathlib import Path

          p = Path("main_marked_round1.tex")
          s = p.read_text()

          # Deleted material from the submitted manuscript is omitted from the
          # marked-up revised copy; additions remain visibly marked by
          # latexdiff. This keeps the revised manuscript's pagination and
          # numbering usable in the response letter.
          doc = r"\begin{document}"
          if doc not in s:
              raise SystemExit("begin-document marker not found")
          pre, body = s.split(doc, 1)

          def strip_deleted_blocks(text):
              pos = 0
              while True:
                  candidates = []
                  for begin, end in [
                      (r"\DIFdelbeginFL", r"\DIFdelendFL"),
                      (r"\DIFdelbegin", r"\DIFdelend"),
                  ]:
                      k = text.find(begin, pos)
                      while k >= 0 and begin == r"\DIFdelbegin" and text.startswith(r"\DIFdelbeginFL", k):
                          k = text.find(begin, k + 1)
                      if k >= 0:
                          candidates.append((k, begin, end))
                  if not candidates:
                      return text
                  k, begin, end = min(candidates, key=lambda x: x[0])
                  j = text.find(end, k + len(begin))
                  if j < 0:
                      raise SystemExit(f"unmatched {begin}")
                  text = text[:k] + text[j + len(end):]
                  pos = max(0, k - 20)

          def remove_macro_argument(text, macro):
              pos = 0
              while True:
                  k = text.find(macro, pos)
                  if k < 0:
                      return text
                  if macro == r"\DIFdel" and text.startswith(r"\DIFdelFL", k):
                      pos = k + 1
                      continue
                  j = k + len(macro)
                  while j < len(text) and text[j].isspace():
                      j += 1
                  if j >= len(text) or text[j] != "{":
                      pos = j
                      continue
                  depth = 0
                  q = j
                  while q < len(text):
                      ch = text[q]
                      if ch == "\\":
                          q += 2
                          continue
                      if ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              q += 1
                              break
                      q += 1
                  if depth != 0:
                      raise SystemExit(f"unbalanced argument of {macro}")
                  text = text[:k] + text[q:]
                  pos = max(0, k - 20)

          body = strip_deleted_blocks(body)
          for macro in (r"\DIFdelFL", r"\DIFdel"):
              body = remove_macro_argument(body, macro)
          for token in (
              r"\DIFdelbeginFL", r"\DIFdelendFL",
              r"\DIFdelbegin", r"\DIFdelend",
          ):
              body = body.replace(token, "")

          # Deleted round-1 material used packages/macros no longer present in
          # the revised paper. Keep a small compatibility preamble so the
          # latexdiff-generated source remains robust.
          marker = r"\theoremstyle{plain}"
          if marker not in pre:
              raise SystemExit("theoremstyle marker not found")
          pre = pre.replace(
              marker,
              marker + "\n" + r"\input{response/latexdiff_compat.tex}",
              1,
          )

          p.write_text(pre + doc + body)
          PY

      - name: Compile marked-up revised manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main_marked_round1.tex
          working_directory: 01_fixed-h-cfg
          texlive_version: 2026

      - name: Upload marked-up manuscript
        uses: actions/upload-artifact@v7
        with:
          name: 01-fixed-h-cfg-marked-up-round1
          path: |
            01_fixed-h-cfg/main_marked_round1.pdf
            01_fixed-h-cfg/main_marked_round1.tex
          if-no-files-found: error
          retention-days: 30
