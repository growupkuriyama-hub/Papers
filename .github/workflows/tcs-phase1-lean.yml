name: TCS Phase 1 Lean formal verification

on:
  push:
    branches:
      - formalization/tcs-phase1-set-driven-20261016
    paths:
      - 'formalization/TCS-01-Phase1/**'
      - '.github/workflows/tcs-phase1-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: formalization/TCS-01-Phase1
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain with elan
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib and obtain precompiled cache
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build, compile, print axioms, scan prohibited proof tokens
        run: |
          set -euo pipefail
          lean --version
          lake --version
          lake build
          lake env lean TCSPhase1.lean 2>&1 | tee lean-axioms.log
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|opaque)([^[:alnum:]_]|$)' TCSPhase1.lean; then
            echo 'FORBIDDEN TOKEN DETECTED'
            exit 1
          fi
          echo 'No forbidden proof tokens found'
