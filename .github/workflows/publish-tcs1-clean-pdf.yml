name: Publish TCS #1 English and Japanese PDFs

on:
  push:
    branches:
      - main
    paths:
      - "01_fixed-h-cfg/main.tex"
      - "01_fixed-h-cfg/japanese/main_JP.tex"
      - "01_fixed-h-cfg/TCS-D-26-00494_Manuscript_Clean.tex"
      - "01_fixed-h-cfg/**/*.sty"
      - "01_fixed-h-cfg/**/*.cls"
      - ".github/workflows/publish-tcs1-clean-pdf.yml"
  workflow_dispatch:

# Only this main-branch build can push the generated PDF.
permissions:
  contents: write

concurrency:
  group: publish-tcs1-clean-pdf
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish the latest TCS #1 English and Japanese PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Verify English source of truth and clean mirror
        shell: bash
        run: |
          set -euo pipefail
          cmp 01_fixed-h-cfg/main.tex 01_fixed-h-cfg/TCS-D-26-00494_Manuscript_Clean.tex

      - name: Build clean English PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: 01_fixed-h-cfg
          texlive_version: 2026

      - name: Force a fresh Japanese PDF build
        shell: bash
        run: rm -f 01_fixed-h-cfg/japanese/main_JP.pdf

      - name: Build Japanese PDF with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main_JP.tex
          working_directory: 01_fixed-h-cfg/japanese
          texlive_version: 2026
          latexmk_use_lualatex: true

      - name: Update both tracked PDFs at stable GitHub URLs
        shell: bash
        run: |
          set -euo pipefail
          english_source="01_fixed-h-cfg/main.pdf"
          english_public="01_fixed-h-cfg/TCS-D-26-00494_Manuscript_Clean.pdf"
          japanese_public="01_fixed-h-cfg/japanese/main_JP.pdf"
          test -s "$english_source"
          test -s "$japanese_public"
          test "$(head -c 4 "$english_source")" = "%PDF"
          test "$(head -c 4 "$japanese_public")" = "%PDF"
          cp "$english_source" "$english_public"
          git add "$english_public" "$japanese_public"
          if git diff --cached --quiet; then
            echo "Published PDF is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Publish latest TCS #1 English and Japanese PDFs [skip ci]"
          # Only fast-forward main. A concurrent manuscript edit cannot be overwritten.
          git push origin HEAD:main
