    sync_status: "v116 EN/JP/response synchronized on the theorem/label surface. The finite-sample hypothesis was simplified to one substring-indexed state per observed factor, with the unary relation filtered by h; this quotient is language-equivalent to v115 for every finite sample and aligns the construction with Clark 2013 Algorithm 1. Soundness and completeness were rewritten, the explicit build bound improved from degree five to degree four in the sample-size parameter, the parity example was scoped to the present completeness proof, the source-to-typed thickness gap was promoted to a proposition, and notation/presentation were cleaned. Brittle hard-coded page/line locators were removed from the response in favor of section/statement references."
  keyword_update: "2026-10-05: Added five EN/JP abstract keywords for TCS revision-form compliance; mathematical content unchanged."
