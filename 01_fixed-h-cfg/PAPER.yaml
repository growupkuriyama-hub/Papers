  v121_tcs_preflight_update: "2026-10-07: Corrected CFG trim to prune nonproductive then unreachable symbols, cited classical generalized definite / locally trivial-semigroup sources (Pin 1997 and Pin 2025), updated Kanazawa to peer-reviewed JoLLI 1996, established sharp CTR_1 (1,1)-substitutability with non-KL conclusion explicitly scoped to rho>=2, qualified the polynomial dependence on fixed h and Sigma, clarified the Section 7 typed-refinement introduction and standard Takada control-set product. Main text still compiles to 25 pp with 994 numbered lines. Synchronized all 49 response items and 76 clean page-line locators; 14-page response and CI-generated marked-up PDF are separate artifacts. JP correspondence synchronized in the subsequent Japanese source update, verified by LuaLaTeX CI (28pp)."

  v121_japanese_sync_update: "2026-10-07: Japanese translation revised against English v121; fixed abstract scope for linear subclass under any fixed h, trim definition, algebraic attribution, CTR_1 sharp boundary, polynomial dependence, Takada standard product phrasing, and 1996 Kanazawa / 1997 Pin references. Japanese source hash verified against GitHub blob ee0488ccb59378294c3688e6ea60002c5fa9da26. GitHub Actions LuaLaTeX success (28pp); deliverable main_JP.tex and main_JP.pdf. English clean/marked/response documents unchanged."

  v122_final_precision_update: "2026-10-07: Final Claude-audit precision pass. Corrected universal quantification in (k,l)-substitutability; fixed the typed-refinement domain to arbitrary nonempty CFL grammars; standardized the batch grammar as B_h(K); corrected the stabilization reference to A_h; clarified set-driven and characteristic-sample definitions, empty-target handling, Clark 2013 lambda difference, Q(x) relative heights, and the KL = union RS_h / CFL-slice distinction. Removed duplicate quantitative prose, the tangential SDPDA-thickness/Tajima comparison and their unused references, and a redundant fixed-window corollary; moved the Takada product paragraph after the linear example; added a title to the reconstruction theorem; unified ICGI proceedings labels as LNCS. Response R1.2/R1.10/R2.2 updated and all 49 items / 76 clean locators re-audited against the 25-page v122 clean manuscript (982 numbered lines). English clean 25pp, response 14pp, JP 28pp; all local builds successful."

  v123_claude_audit_update: "2026-10-07: Post-R1 working English source: clarified marked prefix/suffix preservation in Appendix A.1 and established the full typed-yield-language equality by a successful-derivation grafting argument in Proposition 5.2. The locally trivial bound now cites the equality and the direct fixed-window estimate is explicitly attributed to Theorem 7.2 and Proposition 7.3. Narrowed closure and novelty wording, added proposition references, fixed undefined C_L, and corrected minor terminology/TeX formatting. Retained existing symbol naming (notation-collision proposal rejected), and made no new polynomial guarantee for variable window sizes or incremental data. Submitted R1 clean PDF, marked PDF and page/line response locators remain tied to the frozen v122 submission; this v123 working source was not regenerated into that R1 package. Japanese translation is still at v122."

  v124_concision_and_source_audit: "2026-10-07: English working-source revision after independent evaluation of Claude concision proposals: introductory and repetitive prose shortened, all central soundness/completeness/Gold proofs retained, regular-filter example maintained for R2.3, and the linear-spine Appendix B construction consolidated using right and left chains. Added Wakatsuki--Tomita 1993 original and corrected EHY thickness citation to Definition 2.11 (IPTtD remains Definition 2.12); moved formal locally trivial definition to Section 2.2, used n=|h(Sigma+)|+1 in Proposition 3.5 and Corollary 7.4 to satisfy Pin II.6.35, clarified Q(x) occurrence quantification and odd/even nonterminal naming. Response R1.2, R1.5, R1.11, R1.12, R1.31, R2.4 narratives updated. Source labels/citation keys/environment counts statically checked. English and response were not yet recompiled as a definitive submission package; frozen 25-page v122 clean PDF and 76 page/line locators in the response have not been resynchronized. Before Editorial Manager approval, regenerate clean/marked/response PDFs and all locator positions. JP remains v122."

