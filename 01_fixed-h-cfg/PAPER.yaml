  v121_tcs_preflight_update: "2026-10-07: Corrected CFG trim to prune nonproductive then unreachable symbols, cited classical generalized definite / locally trivial-semigroup sources (Pin 1997 and Pin 2025), updated Kanazawa to peer-reviewed JoLLI 1996, established sharp CTR_1 (1,1)-substitutability with non-KL conclusion explicitly scoped to rho>=2, qualified the polynomial dependence on fixed h and Sigma, clarified the Section 7 typed-refinement introduction and standard Takada control-set product. Main text still compiles to 25 pp with 994 numbered lines. Synchronized all 49 response items and 76 clean page-line locators; 14-page response and CI-generated marked-up PDF are separate artifacts. JP correspondence synchronized in the subsequent Japanese source update, verified by LuaLaTeX CI (28pp)."

